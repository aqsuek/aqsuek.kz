<!DOCTYPE html>
<html lang="kk" class="qarip-stories qarip-v2">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Қазақша Stories редакторы | Таңба</title>
<meta name="description" content="Қазақша Stories үшін мәтін, қаріп, фон және логотиппен дайын 9:16 PNG жасаңыз."/>
<link rel="canonical" href="https://aqsuek.kz/tanba/stories/"/>
<link rel="icon" href="/tanba/assets/tanba-mark.png" type="image/png"/>
<meta property="og:site_name" content="Таңба"/>
<link rel="stylesheet" href="/tanba/catalog-pages.css?v=tanba9"/>
<link rel="stylesheet" href="/tanba/stories-editor.css?v=tanba9" data-stories-editor-css="1"/>
<script src="/tanba/stories-editor.js?v=tanba9" defer data-stories-editor="1"></script>
<script defer src="/tanba/qarip-site.js?v=tanba9"></script>
<style>
html.qarip-stories,html.qarip-stories body{background:#0a0a0c!important}
html.qarip-stories .intro,html.qarip-stories #catalog,html.qarip-stories .stories-promo,
html.qarip-stories .qarip-landing,html.qarip-stories .reels-copy,html.qarip-stories #tester,
html.qarip-stories #about,html.qarip-stories .topbar,html.qarip-stories .stories-page-hero,
html.qarip-stories footer,html.qarip-stories .reels-pick:before{display:none!important}
html.qarip-stories #reels.reels-pick,html.qarip-stories .reels-pick{background:transparent!important}
</style>
</head>
<body>
<main>
<section class="reels-pick" id="reels">
  <div class="phone-preview">
    <div class="subtitle-stack" style="--reel-hook:42px;--reel-mark:19px">
      <strong class="sub-hook" style="font-family:&quot;Playfair Display&quot;, serif;font-weight:700;font-style:italic;color:#fff">Stories-қа</strong>
      <mark class="sub-mark" style="font-family:&quot;Montserrat&quot;, sans-serif;font-weight:800;font-style:normal;text-transform:none;background:#d9ff47;color:#181816">қай стиль?</mark>
    </div>
  </div>
  <div class="reels-controls" hidden aria-hidden="true">
    <div class="reels-options">
      <button type="button" class="selected"><span>01</span><b><i style="font-family:&quot;Playfair Display&quot;, serif;font-style:italic;font-weight:700">Playfair</i> × <em style="font-family:&quot;Montserrat&quot;, sans-serif;font-style:normal;font-weight:800">Montserrat</em></b></button>
      <button type="button" class="random"><span>08</span><b>Кездейсоқ</b></button>
    </div>
    <div class="reels-options reels-colors">
      <button type="button" class="selected"><span>01</span><span class="swatch"><i style="background:#fff"></i><i style="background:#d9ff47"></i><i style="background:#fff"></i></span><b>Acid</b></button>
      <button type="button" class="random"><span>08</span><span class="swatch"><i style="background:#fff"></i><i style="background:#d9ff47"></i><i style="background:#fff"></i></span><b>Кездейсоқ</b></button>
    </div>
    <div class="reels-copy-edit">
      <input aria-label="Акцент" placeholder="Акцент" value="Stories-қа"/>
      <input aria-label="Қосымша" placeholder="Қосымша" value="қай стиль?"/>
    </div>
    <div class="reels-size">
      <input aria-label="Өлшем" type="range" min="24" max="64" value="42"/>
      <strong>42px</strong>
    </div>
    <div class="reels-actions">
      <button type="button" class="reels-act">9:16 PNG</button>
      <button type="button" class="reels-act">Бөлісу</button>
    </div>
  </div>
</section>
</main>
<script src="/tanba/qarip-lib.js?v=tanba9"></script>
<script src="/tanba/reels-studio-gesture6.js?v=tanba9"></script>
</body>
</html>
