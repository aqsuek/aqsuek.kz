name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Pages site without heavy font zips
        run: |
          rsync -a --delete \
            --exclude 'tanba/downloads/' \
            --exclude 'tanba/downloads/**' \
            site/ _site/
          # Keep a tiny note so old paths are diagnosable in repo deploy logs
          mkdir -p _site/tanba/downloads
          printf '%s\n' \
            'Font ZIP downloads are served from GitHub raw CDN (tag tanba-fonts-v1).' \
            'See fonts.json download URLs.' \
            > _site/tanba/downloads/README.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
